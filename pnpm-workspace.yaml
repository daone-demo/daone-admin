# Daone 单包 workspace 根。pnpm 主版本固定为 11（见 package.json#packageManager / engines.pnpm）。
# 配置只写在本文件；pnpm 11 会忽略 package.json#pnpm，请勿再加回去。
packages:
  - "."

shamefullyHoist: true
enablePrePostScripts: false
strictPeerDependencies: false

# 允许执行 install 脚本的依赖（取代 onlyBuiltDependencies / ignoredBuiltDependencies）
allowBuilds:
  "@parcel/watcher": true
  "core-js": true
  "es5-ext": true
  esbuild: true
  typeit: true
  vue-demi: true
  "@tailwindcss/oxide": false

# 历史弃用包告警抑制
allowedDeprecatedVersions:
  are-we-there-yet: "*"
  sourcemap-codec: "*"
  lodash.isequal: "*"
  domexception: "*"
  w3c-hr-time: "*"
  inflight: "*"
  npmlog: "*"
  rimraf: "*"
  stable: "*"
  gauge: "*"
  abab: "*"
  glob: "*"

# P1-03：收敛传递依赖已知高危漏洞
overrides:
  lodash: ">=4.17.24"
  lodash-es: ">=4.17.24"
  defu: ">=6.1.5"
  picomatch: ">=4.0.4"
