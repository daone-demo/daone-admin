# =========================================================
# daone-admin 宿主机测试站（端口 9081 + TLS）示例
# =========================================================
# Docker 镜像不要用本文件：容器配置见 nginx.docker.conf（listen 80、root /usr/share/nginx/html）。
#
# 说明：
# - 你贴的 Untitled-1（listen 8088）是「测试网关/用户端」配置，不是本后台站点。
# - 运营后台部署在 9081 时，浏览器请求同源 /api/...，必须在【9081 这个 server】里反代。
#
# 本地 Vite 实际链路：
#   /api/admin/v1/sms-code
#   → https://43.161.199.75:8088/api/api/admin/v1/sms-code
#   → 8088 的 location /api/ 剥掉一层 /api/
#   → http://127.0.0.1:8086/api/admin/v1/sms-code
#
# 因此 9081 应把 /api/ 转到后端 /api/（直接打 8086，或经 8088/api/api/）。

server {
    listen       9081 ssl;
    server_name  _;

    ssl_certificate     /etc/nginx/ssl/ip.crt;
    ssl_certificate_key /etc/nginx/ssl/ip.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    # 改成实际 admin 静态目录
    root /home/daone/www/admin;
    index index.html;

    # 与本地 Vite proxy 等价：浏览器 /api/xxx → 后端 /api/xxx
    location /api/ {
        proxy_pass http://127.0.0.1:8086/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
