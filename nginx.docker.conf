# =========================================================
# daone-admin Docker 镜像 Nginx（与 Dockerfile 配套）
# =========================================================
# 契约：
# - 容器监听 80（与 EXPOSE 80 一致）
# - 静态根目录 /usr/share/nginx/html（与 COPY dist 目标一致）
# - 浏览器同源 /api，由本文件反代到 VITE_API_BASE_HOST 等价地址
#   （规则同 vite.config.ts createDevApiProxy：/api/foo → /api/api/foo）
#
# TLS 在网关终止。宿主机 9081+证书部署请用 nginx.conf，不要把本文件拷到宿主机。
#
# 若容器与后端同机，将 proxy_pass 改为：
#   http://host.docker.internal:8086/api/
# 并在 docker run 加 --add-host=host.docker.internal:host-gateway

server {
    listen       80;
    server_name  _;

    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://43.161.199.75:8088/api/api/;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
